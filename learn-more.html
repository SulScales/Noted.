<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101411">
  <meta name="description" content="More information about a Noted service plan.">
  <title>Learn more — Noted</title>
  <style>
    :root{color-scheme:dark;--bg:#101411;--panel:#171d19;--text:#f1f4ef;--muted:#a1aaa3;--line:#303a33;--green:#a8d7b5;--ink:#142219}
    *{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:radial-gradient(ellipse at 50% 0,#243a2a 0,transparent 46%),var(--bg);color:var(--text);font:16px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}a:focus-visible{outline:2px solid var(--green);outline-offset:4px}.container{width:min(calc(100% - 40px),1000px);margin:auto}header{height:76px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;background:rgba(16,20,17,.75)}.brand{font-size:25px;font-weight:800;letter-spacing:-1.5px}.brand span{color:var(--green)}main{flex:1;display:grid;place-items:center;padding:60px 0}.panel{width:min(100%,660px);padding:clamp(28px,6vw,56px);border:1px solid #35453a;border-radius:16px;background:rgba(23,29,25,.94)}.eyebrow{color:var(--green);font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;margin-bottom:14px}h1{font-size:clamp(37px,6vw,56px);line-height:1.04;letter-spacing:-.05em;margin-bottom:15px}p{color:var(--muted)}.plan{color:var(--green)}.placeholder{margin:28px 0;padding:20px;border:1px dashed #506153;border-radius:10px;background:#131a15;color:#b5c0b7;font-size:14px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 16px;border:1px solid #455048;border-radius:7px;font-size:13px;font-weight:750}.button.primary{border-color:var(--green);background:var(--green);color:var(--ink)}.button:hover{border-color:var(--green)}footer{border-top:1px solid var(--line);padding:22px 0;color:#849087;font-size:12px}.foot{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}@media(max-width:520px){.container{width:min(calc(100% - 30px),1000px)}.actions{flex-direction:column}.foot{flex-direction:column;text-align:center}}
  </style>
</head>
<body>
  <header><div class="container"><a class="brand" href="Noted.ProfWeb.html#top">Noted<span>.</span></a></div></header>
  <main><section class="container panel" aria-labelledby="title">
    <div class="eyebrow">Plan details</div>
    <h1 id="title">Learn more about <span class="plan" id="plan-name">your plan</span></h1>
    <p id="plan-description">More information about this plan will be added here.</p>
    <div class="placeholder" id="detail-placeholder">This page is ready for the additional plan details you’ll provide.</div>
    <div class="actions"><a class="button primary" href="pricing.html">Back to pricing</a><a class="button" href="Noted.ProfWeb.html#contact">Contact Noted</a></div>
  </section></main>
  <footer><div class="container foot"><span>© 2026 Noted. All rights reserved.</span><a href="Noted.ProfWeb.html#top">Back to Noted home</a></div></footer>
  <script>
    const plans={
      starter:{name:'Starter',description:'A focused starting point for single-location businesses beginning with ads and AI search visibility.'},
      growth:{name:'Growth',description:'A cross-channel plan for established businesses ready to build steady lead flow and broader visibility.'},
      scale:{name:'Scale',description:'A broader program for businesses with larger ad budgets or multiple locations.'}
    };
    const planKey=new URLSearchParams(window.location.search).get('plan');
    const selected=plans[planKey]||null;
    if(selected){document.title=`${selected.name} plan — Noted`;document.querySelector('#plan-name').textContent=selected.name;document.querySelector('#plan-description').textContent=selected.description;}
    else{document.querySelector('#detail-placeholder').textContent='Choose a plan from the pricing page to see its details here.';}
  </script>
</body>
</html>
